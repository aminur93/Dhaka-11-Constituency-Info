# Scalar types
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type User {
    id: ID!
    name: String!
    email: String!
    phone: String!
    image: String
    image_url: String
    user_type: UserType!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

enum UserType {
    OWNER @enum(value: "owner")
    SUPERADMIN @enum(value: "superadmin")
    ADMIN @enum(value: "admin")
    SUBSCRIPTION @enum(value: "subcription")
}

input CreateUserInput {
    name: String! @rules(apply: ["required", "string", "max:255"])
    email: String! @rules(apply: ["required", "email", "unique:users,email"])
    phone: String! @rules(apply: ["required", "unique:users,phone"])
    image: String
    image_url: String
    user_type: UserType
    password: String! @rules(apply: ["required", "min:8"])
}

input UpdateUserInput {
    id: ID!
    name: String @rules(apply: ["string", "max:255"])
    email: String @rules(apply: ["email", "unique:users,email"])
    phone: String @rules(apply: ["unique:users,phone"])
    image: String
    image_url: String
    user_type: UserType
    password: String @rules(apply: ["min:8"])
}

type Query {
    # Get all users
    users: [User!]! @all
    
    # Get user by ID
    user(id: ID! @eq): User @find
    
    # Search users by name
    searchUsers(name: String @where(operator: "like")): [User!]! @all
    
    # Paginated users (automatically creates UserPaginator type)
    usersPaginated(first: Int!, page: Int): [User!]! @paginate
}

type Mutation {
    # Create user
    createUser(input: CreateUserInput! @spread): User @create
    
    # Update user
    updateUser(input: UpdateUserInput! @spread): User @update
    
    # Delete user
    deleteUser(id: ID! @eq): User @delete
}
